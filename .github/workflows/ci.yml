# CI gates from the constitution (fmt/build/test, frontend lint/tsc/test/build,
# >= 95% line coverage). Fuzz/invariant seeds are fixed in foundry.toml
# [profile.ci] (research R10) — FOUNDRY_PROFILE=ci selects them.
#
# Runner is PINNED to ubuntu-24.04 rather than ubuntu-latest: the label moves
# to Ubuntu 26.04 between 2026-10-19 and 2026-11-19, and an image swap under a
# green branch shows up as a break in the NEXT run, not at the swap. Moving to
# 26.04 is a deliberate, separately-green commit. Actions are pinned to @v5
# (node24) to clear the Node 20 deprecation warning.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    name: Contracts — fmt, build, test, coverage gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with OpenZeppelin submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge fmt --check
        run: forge fmt --check

      - name: forge build --deny warnings
        run: forge build --deny warnings

      - name: forge test (unit + fuzz + invariant, fixed seeds)
        run: forge test -vvv

      - name: Coverage gate (>= 95% line coverage on src/)
        run: ./script/coverage-gate.sh

      # lcov.info is gitignored, so the numbers behind the gate only exist on
      # the machine that ran it. Publish it as an artifact so the exact report
      # is downloadable from the run. `if: always()` so a FAILED gate can still
      # be inspected — that is when the report matters most. upload-artifact@v6
      # is the lowest major on node24 (v4/v5 would reintroduce the Node 20
      # deprecation warning this workflow just removed).
      - name: Upload coverage report (lcov.info)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend — lint, typecheck, test, build, browser checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exact pins)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

      - name: Build (Vite)
        run: npm run build

      # Responsive (375px, T056) and theme-fidelity (T060) checks were
      # manual-only before this stage. They spawn their OWN `vite preview`
      # (ports 4173 / 4174), so they run sequentially after the build.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive check (375x812, no h-scroll, /dashboard direct load)
        run: node scripts/responsive-check.mjs

      - name: Theme check (fonts, CSS vars, press-tile, no dark mode)
        run: node scripts/theme-check.mjs

      # Regression gate for the qr/cuer breakage: RainbowKit's QR renderer
      # (cuer) hardcodes `border: 0`, and qr >= 0.6.0 throws on it — React 19
      # then unmounted the whole tree, so every wallet row served a blank white
      # screen. Phase 1 of this check calls the exact production function and
      # needs no WalletConnect project id, so it runs here; the browser phase
      # skips only its QR-render assertion without one.
      - name: Wallet-connect check (qr border:0 regression, connect modal)
        run: node scripts/wallet-connect-check.mjs
